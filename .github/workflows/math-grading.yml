name: Runtime regression CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.8
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Resource failures, legacy parity and native task round trips
        run: .venv/bin/python -m pytest packages/yugos/tests/test_concurrent_calls.py packages/yugos-evals/tests/test_math_process.py packages/yugos-evals/tests/test_math_answer.py packages/yugos-evals/tests/test_math_counterexample.py packages/yugos-evals/tests/test_pairwise_judge.py packages/yugos-evals/tests/test_cruxeval.py -q
      - name: Changed Python source checks
        run: |
          .venv/bin/ruff check packages/yugos/src/yugos/inference/calls.py packages/yugos/tests/test_concurrent_calls.py
          .venv/bin/ruff check packages/yugos-evals/src/yugos_evals/scorers/math.py packages/yugos-evals/src/yugos_evals/scorers/_math*.py packages/yugos-evals/src/yugos_evals/scorers/_outcome.py packages/yugos-evals/tests/test_math_process.py packages/yugos-evals/tests/math_worker_fixture.py
          .venv/bin/ruff format --check packages/yugos-evals/src/yugos_evals/scorers/math.py packages/yugos-evals/src/yugos_evals/scorers/_math*.py packages/yugos-evals/src/yugos_evals/scorers/_outcome.py packages/yugos-evals/tests/test_math_process.py packages/yugos-evals/tests/math_worker_fixture.py
